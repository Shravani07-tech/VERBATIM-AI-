<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  {/* Glowing ambiance backer */}
  <circle cx="50" cy="50" r="48" fill="#080c14" />
  
  {/* Rotating external tracking dials */}
  <circle cx="50" cy="50" r="38" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.85" />
  <circle cx="50" cy="50" r="44" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="3 12" opacity="0.4" />

  {/* Main Geometric Shield Panel */}
  <path d="M50 20 C62 20 68 24 72 28 C72 45 68 62 50 78 C32 62 28 45 28 28 C32 24 38 20 50 20 Z" 
        stroke="url(#shieldGrad)" stroke-width="4.5" stroke-linejoin="round" fill="#03050a" fill-opacity="0.85" />

  {/* RETICLE GRID */}
  <path d="M50 35 L50 65 M35 50 L65 50" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.45" />

  {/* Central verification AI node */}
  <circle cx="50" cy="50" r="12" fill="url(#nodeGlow)" />
  <circle cx="50" cy="50" r="5" fill="#22d3ee" />
</svg>
